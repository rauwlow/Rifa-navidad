<head>

    <style>
        /* Estilos Base y Adaptabilidad */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #ff0000; /* Fondo rojo principal */
            color: white; 
            text-align: center; 
            padding: 10px; /* Reducir padding en móvil */
            margin: 0;
            box-sizing: border-box;
        }
        .header h1 { 
            font-size: 2.5em; /* Ajuste para móvil */
            margin-bottom: 5px; 
        }
        .details p { 
            font-size: 1.2em; /* Ajuste para móvil */
            margin: 5px 0; 
        }
        
        /* Contenedor y Cuadrícula de Números */
        .grid-container { 
            display: flex; 
            justify-content: center; 
            margin: 10px 0;
        }
        .number-grid { 
            border-collapse: collapse; 
            width: 100%; /* Ocupar todo el ancho disponible */
            max-width: 450px; /* Máximo en desktop */
            margin-bottom: 20px; 
            table-layout: fixed; /* Ayuda a que las celdas tengan el mismo ancho */
        }
        .number-grid td { 
            border: 1px solid white; 
            padding: 8px 0; /* Padding vertical más pequeño para compactar */
            cursor: pointer; 
            background-color: rgba(0, 0, 0, 0.4); 
            font-weight: bold; 
            font-size: 0.9em; /* Fuente más pequeña para que quepa bien */
            width: 10%; 
            box-sizing: border-box; 
            line-height: 1;
        }
        .number-grid td:hover { background-color: #000000; }
        .number-grid td.selected { background-color: #f7d242; color: black; }
        
        /* Formulario y Botones */
        .form-container { 
            padding: 20px 10px; /* Ajuste para móvil */
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px; 
            max-width: 400px; 
            margin: 20px auto; 
        }
        .form-container input, .form-container button { 
            width: 95%; /* Ajuste a 95% para tener un poco de margen */
            padding: 12px; 
            margin-bottom: 15px; 
            border: none; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 1em;
        }
        .form-container button { 
            background-color: #f7d242; 
            color: black; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .form-container button:disabled { background-color: gray; cursor: not-allowed; }
        .message { margin-top: 15px; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 1em; }
        
        /* Media Query para pantallas grandes (opcional, para mejorar el desktop) */
        @media (min-width: 600px) {
            .number-grid td {
                font-size: 1.1em;
                padding: 10px 0;
            }
        }
    </style>
</head>
