<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Navideña - ¡Aparta tu número!</title>
    <style>
        /* ... CSS styles here ... */
    </style>
</head>
<body>

    <div class="header">
        <h1>🎄 RIFA NAVIDEÑA 🌟</h1>
        <div class="details">
            <p>PREMIO: **300K**</p>
            <p>NÚMERO: **$10K**</p>
        </div>
    </div>

    <div class="grid-container">
        <table class="number-grid" id="numberGrid">
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="form-container">
        <h2>Aparta tu Número</h2>
        <form id="raffleForm">
            <input type="hidden" id="selectedNumber" name="Número" value="">
            <input type="text" id="participantName" name="Nombre" placeholder="Tu Nombre Completo" required>
            <button type="submit" id="submitButton">Apartar y Pagar</button>
        </form>
        <div id="statusMessage" class="message"></div>
    </div>

    <div class="footer">
        <p>JUEGA CON SINUANO NOCHE 12/20</p>
        <p>NEQUI: **319 773 1840**</p>
    </div>

    <script>
        // --- 🟢 URL DE LA APLICACIÓN WEB DE GOOGLE APPS SCRIPT (URL ACTIVA) 🟢 ---
        const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzN1HCLSvaKRr9Kg_IclrJLa3Vhzg_F-gxHRFmMBQ1JVrmNoXKUCiP3ABsqGr87m8D03Q/exec"; 
        // -----------------------------------------------------------------------------
        const MAX_NUMBERS = 5; 

        // --- JavaScript Selection and Submission Logic (Remains unchanged) ---
        const cells = document.querySelectorAll('#numberGrid td');
        const selectedNumberInput = document.getElementById('selectedNumber');
        const form = document.getElementById('raffleForm');
        const submitButton = document.getElementById('submitButton');
        const statusMessage = document.getElementById('statusMessage');
        const nequiNumber = "3197731840"; 
        
        let selectedNumbers = [];

        // 1. Lógica de selección de número MÚLTIPLE con límite
        cells.forEach(cell => {
            cell.listener = function() {
                const number = this.getAttribute('data-number');
                
                if (this.classList.contains('selected')) {
                    // Deseleccionar
                    this.classList.remove('selected');
                    selectedNumbers = selectedNumbers.filter(n => n !== number);
                } else {
                    // Seleccionar con límite
                    if (selectedNumbers.length >= MAX_NUMBERS) {
                        statusMessage.style.color = 'orange';
                        statusMessage.textContent = `¡Máximo ${MAX_NUMBERS} números por compra!`;
                        return; 
                    }
                    
                    this.classList.add('selected');
                    selectedNumbers.push(number);
                }
                
                statusMessage.style.color = 'white'; 
                selectedNumberInput.value = selectedNumbers.join(',');
                
                const count = selectedNumbers.length;
                const totalCost = count * 10; 
                statusMessage.textContent = 
                    `Números seleccionados: ${count} de ${MAX_NUMBERS}. Total a pagar: $${totalCost}K.`;
            };
            cell.addEventListener('click', cell.listener);
        });

        // 2. Lógica de envío del formulario al Apps Script (Backend)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (selectedNumbers.length === 0) {
                statusMessage.style.color = 'red';
                statusMessage.textContent = 'Por favor, selecciona al menos un número antes de continuar.';
                return;
            }

            submitButton.disabled = true;
            statusMessage.style.color = 'white';
            statusMessage.textContent = 'Enviando y verificando disponibilidad de los números...';

            const name = document.getElementById('participantName').value;
            let allSuccess = true;
            const registeredNumbers = [];
            const failedNumbers = [];
            
            // --- Bucle para enviar cada número individualmente ---
            for (const num of selectedNumbers) {
                const formData = new FormData();
                formData.append('Nombre', name);
                formData.append('Número', num); 
                
                try {
                    const response = await fetch(ENDPOINT_URL, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        registeredNumbers.push(num);
                    } else {
                        allSuccess = false;
                        failedNumbers.push(num);
                    }
                } catch (error) {
                    allSuccess = false;
                    statusMessage.style.color = 'red';
                    statusMessage.textContent = `Error de conexión. Asegúrate que la URL de Apps Script sea correcta y esté activa.`;
                    submitButton.disabled = false;
                    return; 
                }
            }
            
            // --- Reporte Final después del Bucle ---
            if (registeredNumbers.length > 0) {
                statusMessage.style.color = 'green';
                const cost = registeredNumbers.length * 10;
                
                let message = `¡Felicidades! Has apartado ${registeredNumbers.length} números (${registeredNumbers.join(', ')}). Total: $${cost}K.`;
                
                if (failedNumbers.length > 0) {
                    message += ` ⚠️ Los números ${failedNumbers.join(', ')} no se pudieron registrar (ya estaban ocupados).`;
                }

                statusMessage.innerHTML = `${message} <br><br> <a href="#" id="whatsappLink">Enviar WhatsApp de Pago</a>`;
                
                createWhatsappLink(registeredNumbers, name, cost);
                
                registeredNumbers.forEach(num => {
                    const cell = document.querySelector(`[data-number="${num}"]`);
                    if(cell) {
                        cell.style.cursor = 'default';
                        cell.style.backgroundColor = '#808080'; // Gris
                        cell.classList.remove('selected');
                        cell.removeEventListener('click', cell.listener);
                    }
                });

            } else if (failedNumbers.length > 0) {
                statusMessage.style.color = 'red';
                statusMessage.textContent = 
                    `Error: No se pudo apartar ningún número. Los números seleccionados (${failedNumbers.join(', ')}) probablemente ya están ocupados.`;
            }
            
            selectedNumbers = []; 
            submitButton.disabled = false;
        });

        // 4. Función para generar y adjuntar el enlace de WhatsApp
        function createWhatsappLink(numbers, nombre, cost) {
            const message = encodeURIComponent(`Hola, acabo de apartar ${numbers.length} números (${numbers.join(', ')}) para la rifa a nombre de ${nombre}. El total es de $${cost}K. Procedo a realizar el pago al Nequi ${nequiNumber}.`);
            
            const whatsappLink = document.getElementById('whatsappLink');
            whatsappLink.href = `https://wa.me/${nequiNumber}?text=${message}`;
            whatsappLink.target = '_blank';
        }

        // --- Styles (for completeness) ---
        const style = document.createElement('style');
        style.textContent = `
            body { font-family: Arial, sans-serif; background-color: #ff0000; color: white; text-align: center; padding: 10px; margin: 0; box-sizing: border-box; }
            .header h1 { font-size: 2.5em; margin-bottom: 5px; }
            .details p { font-size: 1.2em; margin: 5px 0; }
            .grid-container { display: flex; justify-content: center; margin: 10px 0; }
            .number-grid { border-collapse: collapse; width: 100%; max-width: 450px; margin-bottom: 20px; table-layout: fixed; }
            .number-grid td { border: 1px solid white; padding: 8px 0; cursor: pointer; background-color: rgba(0, 0, 0, 0.4); font-weight: bold; font-size: 0.9em; width: 10%; box-sizing: border-box; line-height: 1; }
            .number-grid td:hover { background-color: #000000; }
            .number-grid td.selected { background-color: #f7d242; color: black; }
            .form-container { padding: 20px 10px; background-color: rgba(0, 0, 0, 0.7); border-radius: 10px; max-width: 400px; margin: 20px auto; }
            .form-container input, .form-container button { width: 95%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 5px; box-sizing: border-box; font-size: 1em; }
            .form-container input { color: black; }
            .form-container button { background-color: #f7d242; color: black; font-weight: bold; cursor: pointer; }
            .form-container button:disabled { background-color: gray; cursor: not-allowed; }
            .message { margin-top: 15px; font-weight: bold; }
            .footer { margin-top: 20px; font-size: 1em; }
            @media (min-width: 600px) {
                .number-grid td { font-size: 1.1em; padding: 10px 0; }
            }
        `;
        document.head.appendChild(style);
        
        // --- Table HTML generation for completeness (not strictly needed as it's static in your file) ---
        const tableBody = document.querySelector('#numberGrid tbody');
        let tableHTML = '';
        for (let i = 0; i < 100; i++) {
            const num = i < 10 ? '0' + i : String(i);
            if (i % 10 === 0) { tableHTML += '<tr>'; }
            tableHTML += `<td data-number="${num}">${num}</td>`;
            if ((i + 1) % 10 === 0) { tableHTML += '</tr>'; }
        }
        tableBody.innerHTML = tableHTML;
    </script>
</body>
</html>
